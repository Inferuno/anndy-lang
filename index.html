<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="./src/web/playground.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
    <title>anndy</title>
</head>

<body>
    <header>
        <header>
            <h1>a<span>[</span>n<span>]</span>nd<span>"</span>y<span>"</span></h1>
            <p>made by <a href="https://github.com/inferuno">Inferuno</a></p>
        </header>
    </header>
    <main>
        <nav>
            <button class="btn-run" aria-label="Run" title="Run"><i class="ti ti-player-play"></i></button>
            <a class="btn-doc" aria-disabled="true" aria-label="Docs" title="Docs"><i class="ti ti-book"></i></a>
            <hr>
            <a href="#" class="btn-github" aria-label="GitHub" title="GitHub"><i class="ti ti-brand-github"></i></a>
            <button class="btn-settings" disabled aria-label="Settings" title="Settings"><i class="ti ti-settings"></i>
            </button>
        </nav>
        <section class="pane pane-code">
            <label class="label" for="code">Code</label>
            <div class="editor">
                <pre class="gutter" aria-hidden="true">1</pre>
                <textarea id="code" class="code" ...></textarea>
            </div>
            </div>
        </section>
        </section>
        <section class="io">
            <div class="pane pane-input">
                <label class="label" for="input">Input</label>
                <textarea id="input" class="input" spellcheck="false" placeholder="Type input here"></textarea>
            </div>
            <div class="pane pane-output">
                <div class="label">Output</div>
                <pre class="output" aria-live="polite"></pre>
            </div>
        </section>

    </main>
    <script type="module" src="./src/web/playground.ts"></script>
</body>

</html>
